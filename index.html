  <title>कोड की पाठशाला — Night Radio</title>

  <style>
    :root {
      --ink-cream: #F3E9D4;
      --ink-cream-70: rgba(243, 233, 212, 0.72);
      --ink-cream-45: rgba(243, 233, 212, 0.45);
      --marigold: #E3A72B;
      --marigold-glow: rgba(227, 167, 43, 0.55);
      --wine: #7A2036;
      --wine-deep: #4E1220;
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-top: rgba(255, 255, 255, 0.16);
      --glass-bottom: rgba(255, 255, 255, 0.055);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    iframe {
      max-width: 100%;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      color: var(--ink-cream);
      -webkit-font-smoothing: antialiased;
    }

    main.stage {
      position: relative;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      isolation: isolate;
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: -10;
      opacity: 0.16;
      mix-blend-mode: overlay;
      pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: -15;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 30%, rgba(0, 0, 0, 0) 40%, rgba(8, 5, 3, 0.55) 100%);
    }

    /* ---------- top row ---------- */
    .top-row {
      position: fixed;
      top: calc(var(--safe-t) + 14px);
      left: calc(var(--safe-l) + 14px);
      right: calc(var(--safe-r) + 14px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
      gap: 10px;
    }

    .pill-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: linear-gradient(to bottom, var(--glass-top), var(--glass-bottom));
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      font-size: 12.5px;
      font-weight: 500;
      color: black;
      white-space: nowrap;
    }

    .clock-chip {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .live-chip {
      font-weight: 600;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff5b52;
      box-shadow: 0 0 8px rgba(255, 91, 82, 0.9);
      animation: pulse-dot 1.6s ease-in-out infinite;
      flex: none;
    }

    @keyframes pulse-dot {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    .social-row {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: linear-gradient(to bottom, var(--glass-top), var(--glass-bottom));
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      color: var(--ink-cream-70);
      text-decoration: none;
      transition: color .2s ease, transform .2s ease, background .2s ease;
      cursor: pointer;
    }

    .icon-btn:hover {
      color: var(--marigold);
      transform: translateY(-1px);
    }

    .icon-btn svg {
      width: 15px;
      height: 15px;
    }


    .hero-copy {
      position: relative;
      z-index: 5;
      margin-top: auto;
      margin-bottom: 14px;
      padding: 0 24px;
      text-align: center;
      max-width: 640px;
    }

    .eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: yellow;
      font-weight: 700;
      margin-bottom: 14px;
      text-shadow: 0 0 18px var(--marigold-glow);
    }

    .hero-title {
      font-family: 'Tiro Devanagari Hindi', serif;
      font-size: clamp(26px, 5vw, 46px);
      line-height: 1.55;
      letter-spacing: 0.005em;
      margin: 0 0 14px;
      color: var(--ink-cream);
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
      white-space: nowrap;
    }

    .hero-sub {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(14px, 2vw, 17px);
      line-height: 1.6;
      letter-spacing: 0.01em;
      color: var(--ink-cream-70);
      margin: 0;
    }

    .glass {
      border: 1px solid var(--glass-border);
      background: linear-gradient(to bottom, var(--glass-top), var(--glass-bottom));
      backdrop-filter: blur(34px) saturate(170%);
      -webkit-backdrop-filter: blur(34px) saturate(170%);
      box-shadow: 0 16px 48px -12px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    /* ---------- decorative vinyl ---------- */
    .vinyl-deco {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      flex: none;
      position: relative;
      background:
        radial-gradient(circle at 50% 50%, #1a1210 0 6px, transparent 6.5px),
        repeating-radial-gradient(circle at 50% 50%, #14100e 0px, #14100e 1.5px, #1e1815 1.5px, #1e1815 3px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      animation: spin 9s linear infinite;
    }

    .vinyl-deco::before {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--wine), var(--marigold), var(--wine-deep), var(--wine));
    }

    .vinyl-deco::after {
      content: '';
      position: absolute;
      inset: 0;
      margin: auto;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #0c0908;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .vinyl-deco {
        animation: none !important;
      }
    }

    /* ---------- spotify player card ---------- */
    .player-wrap {
      position: relative;
      z-index: 20;
      width: 560px;
      max-width: calc(100vw - 32px);
      padding-bottom: calc(var(--safe-b) + 4px);
    }

    .player-card {
      width: 100%;
      max-width: 560px;
      border-radius: 24px;
      overflow: hidden;
      box-sizing: border-box;
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .player-card:hover {
      transform: translateY(-2px);
    }

    .player-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .player-head .label {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;

  <script>
    (function () {
      // ---------- clock ----------
      var clockEl = document.getElementById('clock');
      function tickClock() {
        var d = new Date();
        var h = d.getHours(), m = d.getMinutes();
        var ap = h >= 12 ? 'PM' : 'AM';
        var h12 = h % 12; if (h12 === 0) h12 = 12;
        clockEl.textContent = h12 + ':' + String(m).padStart(2, '0') + ' ' + ap;
      }
      tickClock();
      setInterval(tickClock, 1000);

      // ---------- listener count (simulated) ----------
      var listenerEl = document.getElementById('listener-count');
      var count = 128 + Math.floor(Math.random() * 90);
      function renderCount() { listenerEl.textContent = count.toLocaleString('en-IN'); }
      renderCount();
      setInterval(function () {
        count += Math.floor(Math.random() * 7) - 3;
        if (count < 40) count = 40;
        renderCount();
      }, 2600);

      // ================= POMODORO =================
      var focusMin = 25, breakMin = 5;
      var mode = 'focus';
      var remaining = focusMin * 60;
      var running = false;
      var pTimer = null;

      var panel = document.getElementById('pomo-panel');
      var fab = document.getElementById('pomodoro-fab');
      var closeBtn = document.getElementById('pomo-close');
      var modeEl = document.getElementById('pomo-mode');
      var timeEl = document.getElementById('pomo-time');
      var toggleBtn = document.getElementById('pomo-toggle');
      var iconEl = document.getElementById('pomo-icon');
      var resetBtn = document.getElementById('pomo-reset');
      var skipBtn = document.getElementById('pomo-skip');

      var PLAY_ICON = '<path d="M8 5v14l11-7z"/>';
      var PAUSE_ICON = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

      function fmtPomo(s) {
        var m = Math.floor(s / 60), r = s % 60;
        return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
      }
      function renderPomo() {
        modeEl.textContent = mode === 'focus' ? 'Focus' : 'Break';
        timeEl.textContent = fmtPomo(remaining);
        iconEl.innerHTML = running ? PAUSE_ICON : PLAY_ICON;
        toggleBtn.setAttribute('aria-label', running ? 'Pause' : 'Start');
      }
      function chime() {
        try {
          var ctx = new (window.AudioContext || window.webkitAudioContext)();
          [880, 1108, 1318].forEach(function (freq, i) {
            var o = ctx.createOscillator(), g = ctx.createGain();
            o.type = 'sine'; o.frequency.value = freq;
            g.gain.value = 0.001;
            o.connect(g); g.connect(ctx.destination);
            var t0 = ctx.currentTime + i * 0.16;
            g.gain.setValueAtTime(0.0001, t0);
            g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.03);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
            o.start(t0); o.stop(t0 + 0.55);
          });
        } catch (e) { }
      }
      function switchMode() {
        mode = (mode === 'focus') ? 'break' : 'focus';
        remaining = (mode === 'focus' ? focusMin : breakMin) * 60;
        chime();
        renderPomo();
      }
      function tickPomo() {
        remaining -= 1;
        if (remaining <= 0) { switchMode(); return; }
        renderPomo();
      }
      function startPomo() {
        running = true;
        pTimer = setInterval(tickPomo, 1000);
        renderPomo();
      }
      function pausePomo() {
        running = false;
        clearInterval(pTimer); pTimer = null;
        renderPomo();
      }
      function togglePomo() { running ? pausePomo() : startPomo(); }
      function resetPomo() {
        pausePomo();
        remaining = (mode === 'focus' ? focusMin : breakMin) * 60;
        renderPomo();
      }
      function skipPomo() {
        pausePomo();
        switchMode();
      }

      fab.addEventListener('click', function () { panel.classList.add('open'); });
      closeBtn.addEventListener('click', function () { panel.classList.remove('open'); });
      toggleBtn.addEventListener('click', togglePomo);
      resetBtn.addEventListener('click', resetPomo);
      skipBtn.addEventListener('click', skipPomo);

      document.getElementById('focus-minus').addEventListener('click', function () {
        focusMin = Math.max(5, focusMin - 5);
        if (mode === 'focus' && !running) { remaining = focusMin * 60; renderPomo(); }
      });
      document.getElementById('focus-plus').addEventListener('click', function () {
        focusMin = Math.min(60, focusMin + 5);
        if (mode === 'focus' && !running) { remaining = focusMin * 60; renderPomo(); }
      });
      document.getElementById('break-minus').addEventListener('click', function () {
        breakMin = Math.max(5, breakMin - 5);
        if (mode === 'break' && !running) { remaining = breakMin * 60; renderPomo(); }
      });
      document.getElementById('break-plus').addEventListener('click', function () {
        breakMin = Math.min(30, breakMin + 5);
        if (mode === 'break' && !running) { remaining = breakMin * 60; renderPomo(); }
      });

      renderPomo();
    })();
  </script>
